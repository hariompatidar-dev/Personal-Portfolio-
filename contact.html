
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact | H. Patidar</title>

    <link rel="stylesheet" href="./dist/output.css" />

    <script src="./src/js/app.js" defer></script>
    <script src="./src/js/contact.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-portfolio-bg text-portfolio-ink">
    <div id="site-header"></div>

    <main
      class="mx-auto w-full max-w-375 px-6 pb-20 pt-12 md:px-8 md:pb-28 md:pt-16 xl:px-10"
    >
      <section
        class="grid grid-cols-1 items-center gap-12 lg:grid-cols-[0.9fr_1.1fr] lg:gap-16"
      >
        <!-- LEFT CONTENT -->
        <div class="flex flex-col">
          <!-- SECTION LABEL -->
          <div class="mb-6 flex items-center gap-4">
            <span class="h-0.75 w-12 bg-portfolio-coral"></span>

            <p
              class="text-sm font-semibold uppercase tracking-widest text-portfolio-muted"
            >
              Contact
            </p>
          </div>

          <!-- HEADING -->
          <h1
            class="max-w-xl font-display text-5xl leading-[1.08] tracking-tight sm:text-6xl xl:text-7xl"
          >
            Let's build
            something
            <span class="block italic text-portfolio-coral">
              together.
            </span>
          </h1>

          <!-- DESCRIPTION -->
          <p
            class="mt-8 max-w-lg text-base leading-8 text-portfolio-muted md:text-lg"
          >
            Have a project idea, a question or just want to say hello?
            Feel free to reach out. I'd love to hear from you.
          </p>

          <!-- CONTACT DETAILS -->
          <div class="mt-12 flex flex-col gap-7">

            <!-- EMAIL -->
            <a
              href="mailto:hariompatidar.prior@gmail.com"
              class="group flex w-fit items-center gap-5 transition-colors hover:text-portfolio-coral"
            >
              <span class="flex size-10 shrink-0 items-center justify-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  class="size-7"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m3 7 9 6 9-6" />
                </svg>
              </span>

              <span class="text-base md:text-lg">
                hariompatidar.prior@gmail.com
              </span>
            </a>

            <!-- GITHUB -->
            <a
              href="https://github.com/hariompatidar-dev"
              target="_blank"
              rel="noopener noreferrer"
              class="group flex w-fit items-center gap-5 transition-colors hover:text-portfolio-coral"
            >
              <span class="flex size-10 shrink-0 items-center justify-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  class="size-7"
                >
                  <path
                    d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.31-3.76-1.31-.5-1.28-1.24-1.62-1.24-1.62-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.71 2.62 1.22 3.26.93.1-.73.39-1.22.71-1.5-2.48-.28-5.09-1.24-5.09-5.53 0-1.22.44-2.22 1.16-3-.12-.28-.5-1.42.11-2.96 0 0 .95-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.12 2.96.72.78 1.15 1.78 1.15 3.01 0 4.3-2.62 5.24-5.12 5.51.4.35.75 1.03.75 2.08v3.1c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"
                  />
                </svg>
              </span>

              <span class="text-base md:text-lg">
                github.com/hariompatidar-dev
              </span>
            </a>

            <!-- LOCATION -->
            <div class="flex w-fit items-center gap-5">
              <span class="flex size-10 shrink-0 items-center justify-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  class="size-7"
                >
                  <path
                    d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"
                  />
                  <circle cx="12" cy="10" r="2.5" />
                </svg>
              </span>

              <span class="text-base md:text-lg">
                Indore, India
              </span>
            </div>

          </div>
        </div>

        <!-- RIGHT: CONTACT FORM -->
        <div
          class="rounded-3xl border border-white/70 bg-white/30 p-6 shadow-[0_12px_35px_rgba(75,45,30,0.07)] backdrop-blur-md sm:p-8 md:p-10"
        >
          <form
            id="contactForm"
            action="https://formsubmit.co/hariompatidar.prior@gmail.com"
            method="POST"
            class="flex flex-col gap-6"
          >
            <!-- FORM CONFIGURATION -->
            <input
              type="hidden"
              name="_subject"
              value="New Portfolio Contact Message"
            />

            <input type="hidden" name="_template" value="table" />

            <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off" />

            <!-- NAME -->
            <div class="flex flex-col gap-2">
              <label for="contactName" class="text-sm font-semibold">
                Name
              </label>

              <input
                id="contactName"
                type="text"
                name="name"
                placeholder="Your name"
                autocomplete="name"
                required
                minlength="2"
                maxlength="80"
                class="w-full rounded-xl border border-portfolio-border bg-transparent px-4 py-4 text-sm outline-none transition placeholder:text-portfolio-muted/70 focus:border-portfolio-coral focus:ring-2 focus:ring-portfolio-coral/10"
              />
            </div>

            <!-- EMAIL -->
            <div class="flex flex-col gap-2">
              <label for="contactEmail" class="text-sm font-semibold">
                Email
              </label>

              <input
                id="contactEmail"
                type="email"
                name="email"
                placeholder="your@email.com"
                autocomplete="email"
                required
                maxlength="254"
                class="w-full rounded-xl border border-portfolio-border bg-transparent px-4 py-4 text-sm outline-none transition placeholder:text-portfolio-muted/70 focus:border-portfolio-coral focus:ring-2 focus:ring-portfolio-coral/10"
              />
            </div>

            <!-- SUBJECT -->
            <div class="flex flex-col gap-2">
              <label for="contactSubject" class="text-sm font-semibold">
                Subject
              </label>

              <select
                id="contactSubject"
                name="topic"
                required
                class="w-full cursor-pointer rounded-xl border border-portfolio-border bg-portfolio-bg px-4 py-4 text-sm outline-none transition focus:border-portfolio-coral focus:ring-2 focus:ring-portfolio-coral/10"
              >
                <option value="" disabled selected>
                  Select a subject
                </option>

                <option value="Project Collaboration">
                  Project Collaboration
                </option>

                <option value="Job Opportunity">
                  Job Opportunity
                </option>

                <option value="Freelance Work">
                  Freelance Work
                </option>

                <option value="General Inquiry">
                  General Inquiry
                </option>

                <option value="Other">
                  Other
                </option>
              </select>
            </div>

            <!-- MESSAGE -->
            <div class="flex flex-col gap-2">
              <label for="contactMessage" class="text-sm font-semibold">
                Message
              </label>

              <textarea
                id="contactMessage"
                name="message"
                rows="5"
                placeholder="Write your message..."
                required
                minlength="10"
                maxlength="3000"
                class="w-full resize-y rounded-xl border border-portfolio-border bg-transparent px-4 py-4 text-sm outline-none transition placeholder:text-portfolio-muted/70 focus:border-portfolio-coral focus:ring-2 focus:ring-portfolio-coral/10"
              ></textarea>
            </div>

            <!-- STATUS MESSAGE -->
            <p
              id="formStatus"
              class="hidden text-sm leading-6"
              role="status"
              aria-live="polite"
            ></p>

            <!-- SUBMIT BUTTON -->
            <button
              id="submitButton"
              type="submit"
              class="flex w-full items-center justify-center gap-3 rounded-xl bg-portfolio-coral px-6 py-4 text-base font-semibold text-white shadow-md transition duration-300 hover:-translate-y-0.5 hover:shadow-lg disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0"
            >
              <span id="submitText">Send Message</span>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="size-5"
              >
                <path d="M7 17 17 7M7 7h10v10" />
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
